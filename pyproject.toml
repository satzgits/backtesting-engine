[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "backtesting-engine"
version = "1.0.0"
description = "Modular event-driven backtesting framework for quantitative strategies"
authors = [{name = "Savith Chandrahas"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "yfinance>=0.2",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/satzgits/backtesting-engine"

[tool.setuptools.packages.find]
include = ["backtester*"]
